name: Keepalive Ping

# Evita que Supabase pause el proyecto por inactividad (7 días)
on:
  schedule:
    - cron: '0 12 * * *'  # Todos los días a las 12:00 UTC
  workflow_dispatch:       # Permite ejecución manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health
        run: |
          curl -sf "${{ secrets.BACKEND_URL }}/api/v1/health" || echo "Backend no disponible"
        continue-on-error: true
