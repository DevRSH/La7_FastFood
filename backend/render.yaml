services:
  - type: web
    name: la7-fastfood-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PIN_CODE
        value: "1234"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
